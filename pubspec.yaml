name: lifeguard_ai
description: "LifeGuard AI - AI-Powered Emergency Healthcare Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Utilities
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # Local Storage
  shared_preferences: ^2.5.3

  # Location & Sensors
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  sensors_plus: ^6.1.1

  # Notifications & Communication
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1

  # Permissions
  permission_handler: ^11.3.1

  # Dependency Injection
  get_it: ^8.0.3

  # Miscellaneous
  intl: ^0.20.2
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/models/
